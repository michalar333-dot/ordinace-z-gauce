<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordinace z gauče</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a side-view treatment room (illustration) above a dialogue panel; kinesio tape as accent */
:root{
  --bg:#EEF3F1; --card:#FFFFFF; --ink:#16302E; --muted:#5A716D; --line:#CFDCD8;
  --tape:#E2457A; --tape-soft:#FBE3EC; --cyan:#1E9DB4; --cyan-soft:#DDF1F5;
  /* the room illustration keeps one look in both themes */
  --wall:#DCEBE7; --wall2:#CFE2DD; --floor:#B9A48A; --floor2:#A8927A; --bed:#2F6F6A; --bed-top:#3E8C86;
  --skin:#F2C7A5; --skin2:#D9A27E; --tunic:#FFFFFF; --pants:#1E9DB4; --hair:#6B3E26; --shoe:#2B2B2B;
  --bubble:#FFFFFF; --bubble-ink:#16302E;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1C1B; --card:#172826; --ink:#E6F0EE; --muted:#9AB2AD; --line:#2B403D;
  --tape:#F0679A; --tape-soft:#3A1E2A; --cyan:#4CC2D8; --cyan-soft:#16343A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1C1B; --card:#172826; --ink:#E6F0EE; --muted:#9AB2AD; --line:#2B403D;
  --tape:#F0679A; --tape-soft:#3A1E2A; --cyan:#4CC2D8; --cyan-soft:#16343A; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding:20px 16px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;letter-spacing:-.02em}
h1 .taped{position:relative;display:inline-block;padding:0 .1em;z-index:0}
h1 .taped::before{content:"";position:absolute;inset:.2em -.05em .06em;background:var(--tape);opacity:.3;border-radius:3px;transform:rotate(-2deg);z-index:-1}
.hud{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:14px}
.hud b{color:var(--ink)}
.hearts{color:var(--tape);letter-spacing:2px}

/* scene */
.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--wall);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
@media (max-width:520px){.scene{aspect-ratio:4/3.4}}
.wallstripe{position:absolute;left:0;right:0;top:52%;height:4%;background:var(--wall2)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,var(--floor) 0 9%,var(--floor2) 9% 9.4%)}
.door{position:absolute;left:3%;bottom:22%;width:12%;height:58%;background:#8DB8B1;border:3px solid #6E9C95;border-bottom:0;border-radius:4px 4px 0 0}
.door::after{content:"";position:absolute;right:12%;top:50%;width:10%;aspect-ratio:1;border-radius:50%;background:#F4D27A}
.door span{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:clamp(7px,1.4vw,10px);color:#fff;background:#6E9C95;padding:1px 4px;border-radius:3px;white-space:nowrap}
.poster{position:absolute;left:22%;top:12%;width:15%;aspect-ratio:3/4;background:#fff;border:2px solid #C9D9D5;border-radius:3px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(8px,1.8vw,13px);color:#2F6F6A;text-align:center;line-height:1.05;padding:4%;transform:rotate(-2deg)}
.poster small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.7em;color:#E2457A;margin-top:4px}
.window{position:absolute;right:6%;top:9%;width:20%;aspect-ratio:4/3;background:linear-gradient(#BFE6F2,#E9F7FB);border:4px solid #fff;border-radius:4px;box-shadow:0 0 0 2px #C9D9D5}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff}
.skeleton{position:absolute;left:39%;bottom:21%;width:7%}
.bedwrap{position:absolute;left:56%;bottom:13%;width:38%}
.bed{display:block;width:100%;height:auto}
.patient{position:absolute;left:2%;bottom:86%;width:95%;transition:opacity .5s, transform .5s}
.patient.gone{opacity:0;transform:translateY(-10%)}
.pt{position:absolute;bottom:12%;width:9%;transition:none}
.pt svg{display:block;width:100%;height:auto;overflow:visible}
.pt.flip svg{transform:scaleX(-1)}
.pt .leg{transform-box:fill-box;transform-origin:50% 0}
.pt.walking .leg.l{animation:swing .42s infinite alternate ease-in-out}
.pt.walking .leg.r{animation:swing .42s infinite alternate-reverse ease-in-out}
.pt.walking svg{animation:bob .21s infinite alternate ease-in-out}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{translate:0 0}to{translate:0 -2%}}
.bubble{position:absolute;left:44%;right:3%;top:5%;background:var(--bubble);color:var(--bubble-ink);border-radius:14px;padding:10px 12px;font-size:clamp(13px,2.4vw,16px);line-height:1.3;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:opacity .25s, transform .25s}
.bubble::after{content:"";position:absolute;left:18%;bottom:-10px;border:10px solid transparent;border-top-color:var(--bubble);border-bottom:0}
.bubble.hidden{opacity:0;transform:translateY(6px);pointer-events:none}
.bubble .name{display:block;font-family:var(--f-mono);font-size:.75em;color:#1E9DB4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-family:var(--f-mono);font-size:clamp(10px,2vw,13px);background:rgba(22,48,46,.82);color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap;transition:opacity .3s}
.hint.hidden{opacity:0}
.float{position:absolute;font-family:var(--f-display);font-weight:800;font-size:clamp(16px,3.5vw,24px);pointer-events:none;animation:up 1.4s forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.panel .lead{margin:0;color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover{border-color:var(--cyan)}
.opt .k{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.opt:focus-visible,.btn:focus-visible,.walk:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.walk{font:inherit;font-size:22px;width:56px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;touch-action:none}
.walk:active{background:var(--cyan-soft)}
.react{border-radius:10px;padding:12px;background:var(--cyan-soft)}
.react.meh{background:var(--tape-soft)}
.react strong{font-family:var(--f-display);font-size:18px;display:block}
.rx{border:1.5px dashed var(--tape);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rx h3{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tape)}
.rx ul{margin:0;padding-left:20px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin:0}
footer{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.pt.walking .leg,.pt.walking svg,.float{animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Ordinace <span class="taped">z gauče</span></h1>
    <div class="hud"><span>Pacient <b id="hudN">1</b>/<b id="hudT">8</b></span><span class="hearts" id="hudH" aria-label="spokojenost"></span></div>
  </header>

  <div class="scene" id="scene" aria-label="Ordinace: fyzioterapeutka, lehátko a pacient">
    <div class="wallstripe"></div>
    <div class="door"><span>ČEKÁRNA</span></div>
    <div class="poster">SEĎ ROVNĚ!<small>(a ty taky)</small></div>
    <div class="window"></div>
    <svg class="skeleton" viewBox="0 0 40 120" aria-hidden="true">
      <circle cx="20" cy="12" r="9" fill="#F4F1E8" stroke="#BDB7A6" stroke-width="1.5"/>
      <circle cx="17" cy="11" r="1.8" fill="#555"/><circle cx="23" cy="11" r="1.8" fill="#555"/>
      <path d="M16 17 h8" stroke="#555" stroke-width="1.2"/>
      <line x1="20" y1="21" x2="20" y2="62" stroke="#F4F1E8" stroke-width="4"/>
      <g stroke="#F4F1E8" stroke-width="2.5" fill="none"><path d="M12 30 q8 -3 16 0"/><path d="M12 36 q8 -3 16 0"/><path d="M12 42 q8 -3 16 0"/><path d="M13 48 q7 -3 14 0"/></g>
      <path d="M8 28 L4 55 M32 28 L38 22" stroke="#F4F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M13 62 h14 l-3 6 h-8 z" fill="#F4F1E8"/>
      <path d="M15 68 L13 98 M25 68 L27 98" stroke="#F4F1E8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="20" y1="98" x2="20" y2="116" stroke="#8A8A8A" stroke-width="2"/>
      <path d="M8 118 h24" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="floor"></div>
    <div class="bedwrap"><svg class="bed" viewBox="0 0 200 70" aria-hidden="true">
      <rect x="20" y="22" width="8" height="46" fill="#5C6B69"/><rect x="172" y="22" width="8" height="46" fill="#5C6B69"/>
      <rect x="0" y="6" width="200" height="18" rx="6" fill="var(--bed)"/>
      <rect x="0" y="4" width="200" height="8" rx="4" fill="var(--bed-top)"/>
      <rect x="4" y="0" width="34" height="8" rx="4" fill="#fff"/>
    </svg>
    <div class="patient" id="patient"></div></div>
    <div class="pt" id="pt" style="left:8%">
      <svg viewBox="0 0 40 92" aria-hidden="true">
        <g class="leg l"><rect x="13" y="56" width="6" height="28" rx="3" fill="var(--pants)"/><rect x="11" y="82" width="10" height="5" rx="2" fill="var(--shoe)"/></g>
        <g class="leg r"><rect x="21" y="56" width="6" height="28" rx="3" fill="var(--pants)"/><rect x="21" y="82" width="10" height="5" rx="2" fill="var(--shoe)"/></g>
        <path d="M6 24 q-2 0 -3 16" stroke="var(--skin)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <rect x="9" y="22" width="22" height="38" rx="7" fill="var(--tunic)" stroke="#D2DEDB" stroke-width="1"/>
        <path d="M14 23 l6 8 l6 -8" stroke="#1E9DB4" stroke-width="2" fill="none"/>
        <rect x="22" y="38" width="6" height="7" rx="1" fill="#E2457A"/>
        <path d="M33 26 q4 6 2 15" stroke="var(--skin)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M11 8 q-8 4 -6 14 q3 -6 7 -7" fill="var(--hair)"/>
        <circle cx="20" cy="12" r="9.5" fill="var(--skin)"/>
        <path d="M10 11 q2 -10 11 -10 q9 0 9 9 q-6 -5 -20 1" fill="var(--hair)"/>
        <circle cx="24" cy="12" r="1.3" fill="#2B2B2B"/>
        <path d="M23 16 q2.5 2 5 0" stroke="#2B2B2B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <circle cx="27" cy="14.5" r="1.6" fill="#F29C9C" opacity=".6"/>
      </svg>
    </div>
    <div class="bubble hidden" id="bubble"></div>
    <div class="hint" id="hint">Dojdi k lehátku: šipky nebo klepni na podlahu</div>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>
  <footer>Jsi nemocná, takže dnes ordinuješ z gauče. Pacienti to chápou.</footer>
</div>

<script>
/* ---------- pacienti ---------- */
const P = [
  {name:"Pan Kubíček, účetní", look:{shirt:"#7A8FA6",hair:"#3B3B3B",acc:"tie"},
   say:"Bolí mě záda. Sedím 12 hodin denně, ale to s tím určitě nesouvisí.",
   o:[
    {t:"Nastavíme vám židli, monitor a každou hodinu se protáhnete.", ok:1, r:"Každou hodinu? To už budu skoro sportovec!"},
    {t:"Zkusil jste sedět 13 hodin? Třeba se to přetočí.", ok:0, r:"Hm. Logické. Zkusím 14, ať je to jisté."},
    {t:"Doporučuji stát. Napořád. I ve spánku.", ok:0, r:"Jako kůň? Manželka bude nadšená."}]},
  {name:"Paní Vlasta, 78 let", look:{shirt:"#B07AA1",hair:"#D8D8D8",acc:"bun"},
   say:"Mladá paní, já cvičím každý den! Teda… myslím na to každý den.",
   o:[
    {t:"Myšlenky se počítají. Jste zdravá jak řípa, nashle.", ok:0, r:"No vidíte! A sousedka mi to nevěřila."},
    {t:"Tak to zkusíme i v reálu. Tři cviky, pět minut denně.", ok:1, r:"Pět minut? To zvládnu i během Ordinace v růžové zahradě."},
    {t:"Pošlu vám cviky telepaticky. Cítíte to?", ok:0, r:"Něco cítím… ale to bude asi ten guláš."}]},
  {name:"Matěj, fotbalista", look:{shirt:"#D9534F",hair:"#C98B3C",acc:"cap"},
   say:"Vyvrtnul jsem si kotník. V sobotu je zápas. Zvládnete zázrak do sobotu?",
   o:[
    {t:"Zatejpuju vás do mumie. Půjdete do brány.", ok:0, r:"Brankář mumie… soupeř se aspoň lekne."},
    {t:"Hrajte po jedné noze. Budete nepředvídatelný.", ok:0, r:"Plameňák v útoku. Trenér mě zabije."},
    {t:"Led, zvednutá noha, šetření a sobotu vynechte.", ok:1, r:"Ach jo… dobře. Ale fandit budu vleže a nahlas."}]},
  {name:"Tomáš, programátor", look:{shirt:"#2F2F2F",hair:"#5A3A22",acc:"glasses"},
   say:"Bolí mě krk. Na monitor koukám zhruba takhle… *předsune hlavu jako želva*",
   o:[
    {t:"Kupte si menší monitor, ať není tak daleko.", ok:0, r:"Mobil je nejmenší monitor. Tím jsem začal."},
    {t:"Monitor do výšky očí a protáhneme šíji.", ok:1, r:"Wow. A to jsem si to chtěl řešit pluginem."},
    {t:"Otočte monitor vzhůru nohama. Procvičíte hlavu.", ok:0, r:"Hm, kód se tím ale nezlepšil. Tak to by mohl být bug."}]},
  {name:"Pan Hypochondr", look:{shirt:"#8BB37A",hair:"#9A9A9A",acc:"none"},
   say:"Na internetu jsem si zjistil, že mám vzácný syndrom. Vlastně asi tři najednou.",
   o:[
    {t:"Gratuluji, sbírka je skoro kompletní!", ok:0, r:"Že jo! Chybí mi už jen jeden, ten lotyšský."},
    {t:"Internet má diagnózu na všechno. Pojďme vás vyšetřit.", ok:1, r:"Vyšetřit? Naživo? To je tak retro… dobře."},
    {t:"Na jaký web chodíte? Objednám se tam taky.", ok:0, r:"Mají dobré recenze. Pět hvězd, dvě amputace."}]},
  {name:"Lucie, maminka", look:{shirt:"#E8A33D",hair:"#2E2E2E",acc:"bun"},
   say:"Bolí mě rameno. Nosím 12 kilo, které pořád chce na ruku a říká „ještě“.",
   o:[
    {t:"Vyměňte ho za lehčí model.", ok:0, r:"Zkoušela jsem. Reklamace se nepřijímají."},
    {t:"Posílíme lopatky a naučíme se střídat ruce.", ok:1, r:"Konečně plán! Pravá ruka si oddechne."},
    {t:"Dejte dítěti GPS, ať chodí samo.", ok:0, r:"Chodí. Hlavně ke schodům a k zásuvce."}]},
  {name:"Pepa, novoroční běžec", look:{shirt:"#3E8C86",hair:"#7A4B2A",acc:"band"},
   say:"Od pondělí běžím maraton! Zatím jsem běžel… na autobus. Ujel mi.",
   o:[
    {t:"Maraton je jen 42 autobusů za sebou. V pohodě.", ok:0, r:"No jo, ale ten autobus mi taky ujel."},
    {t:"Začneme chůzí a krátkými úseky. Maraton počká.", ok:1, r:"Takže v pondělí… procházka? To beru!"},
    {t:"Pondělí v 6:00 start. Já tu budu ležet a fandit.", ok:0, r:"V šest? To spím. A vy taky, ne?"}]},
  {name:"Poslední pacientka: TY", look:{shirt:"#E2457A",hair:"#6B3E26",acc:"blanket"},
   say:"Mám rýmu a teplotu, ale pořád myslím na pacienty. Co se mnou, kolegyně?",
   o:[
    {t:"Rozcvička s horečkou, ať nevypadneš z formy.", ok:0, r:"*kýchne* To snad ne. Jdu radši spát."},
    {t:"Vezmi si ještě tři pacienty navíc. Pro jistotu.", ok:0, r:"Ty jsi ještě horší pacientka než já!"},
    {t:"Klid, čaj, deka a seriál. Pacienti počkají.", ok:1, r:"Konečně rozumná terapeutka! Jdu na to."}]}
];

/* ---------- pacient SVG ---------- */
function patientSVG(L, mood){
  const mouth = mood==="happy" ? '<path d="M18 30 q4 4 8 0" stroke="#2B2B2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
             : mood==="meh" ? '<path d="M18 32 q4 -3 8 0" stroke="#2B2B2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
             : '<path d="M18 31 h8" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/>';
  let acc = "";
  if(L.acc==="cap") acc='<path d="M8 13 q14 -14 28 -2 l8 2 l-8 1 q-14 -6 -28 2 z" fill="#1E9DB4"/>';
  if(L.acc==="glasses") acc='<g stroke="#2B2B2B" stroke-width="1.3" fill="rgba(255,255,255,.4)"><circle cx="18" cy="22" r="3.6"/><circle cx="27" cy="22" r="3.6"/><path d="M21.6 22 h1.8"/></g>';
  if(L.acc==="bun") acc=`<circle cx="9" cy="14" r="6" fill="${L.hair}"/>`;
  if(L.acc==="band") acc='<rect x="10" y="12" width="26" height="4" rx="2" fill="#E2457A"/>';
  if(L.acc==="tie") acc='<path d="M40 25 l10 -3 l2 4 l-10 3 z" fill="#C0392B"/>';
  const blanket = L.acc==="blanket" ? '<rect x="42" y="18" width="128" height="24" rx="10" fill="#F4D27A"/><path d="M50 22 l10 16 M70 22 l10 16 M90 22 l10 16 M110 22 l10 16 M130 22 l10 16 M150 22 l10 16" stroke="#E8B84A" stroke-width="3"/>' : "";
  const thermo = L.acc==="blanket" ? '<rect x="24" y="31" width="14" height="2.4" rx="1.2" fill="#9AA"/><circle cx="38" cy="32.2" r="2" fill="#E2457A"/>' : "";
  return `<svg viewBox="0 0 180 48" aria-hidden="true">
    <rect x="96" y="22" width="70" height="14" rx="6" fill="#3A4A5C"/>
    <rect x="160" y="18" width="8" height="18" rx="3" fill="#2B2B2B"/>
    <rect x="40" y="16" width="64" height="22" rx="10" fill="${L.shirt}"/>
    <path d="M56 18 q10 -10 26 -4" stroke="var(--skin)" stroke-width="6" stroke-linecap="round" fill="none"/>
    ${blanket}
    <circle cx="22" cy="24" r="12" fill="var(--skin)"/>
    <path d="M10 22 q0 -14 14 -13 q10 1 12 8 q-12 -5 -26 5" fill="${L.hair}"/>
    <circle cx="19" cy="22" r="1.4" fill="#2B2B2B"/><circle cx="27" cy="22" r="1.4" fill="#2B2B2B"/>
    ${mouth}${acc}${thermo}
  </svg>`;
}

/* ---------- stav hry ---------- */
const $ = id => document.getElementById(id);
const scene=$("scene"), pt=$("pt"), patientEl=$("patient"), bubble=$("bubble"), panel=$("panel"), hint=$("hint");
const BED_X = 47, START_X = 8, SPEED = 32; // % šířky scény, %/s
let x = START_X, target = null, held = 0, mode = "intro", idx = 0, score = 0, last = 0;
$("hudT").textContent = P.length;

function hud(){ $("hudN").textContent = Math.min(idx+1,P.length); $("hudH").textContent = "♥".repeat(score) + "♡".repeat(Math.max(0,P.length-score)); }

function placePatient(mood){ patientEl.innerHTML = patientSVG(P[idx].look, mood); }

function say(name, text){ bubble.innerHTML = `<span class="name">${name}</span>${text}`; bubble.classList.remove("hidden"); }

function intro(){
  mode="intro"; idx=0; score=0; x=START_X; target=null; hud(); placePatient("neutral");
  bubble.classList.add("hidden"); hint.classList.add("hidden");
  panel.innerHTML = `<span class="label">Směna začíná</span>
    <p class="lead">Čekárna je plná. Dojdi k lehátku, vyslechni pacienta a vyber, co mu odpovíš. Někdy to dopadne odborně, někdy aspoň vtipně.</p>
    <button class="btn" id="go">Jdu na to</button>`;
  $("go").onclick = () => { mode="walk"; hint.classList.remove("hidden"); walkPanel(); };
}

function walkPanel(){
  panel.innerHTML = `<span class="label">Jdi k lehátku</span>
    <div class="controls">
      <button class="walk" id="wl" aria-label="Jít doleva">◀</button>
      <button class="walk" id="wr" aria-label="Jít doprava">▶</button>
      <span class="lead">nebo klepni na podlahu ve scéně</span>
    </div>`;
  const bind=(el,dir)=>{
    const on=e=>{e.preventDefault(); held=dir; target=null;};
    const off=()=>{ if(held===dir) held=0; };
    el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
    el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); target=Math.max(2,Math.min(BED_X,x+dir*12)); }});
  };
  bind($("wl"),-1); bind($("wr"),1);
}

scene.addEventListener("pointerdown", e=>{
  if(mode!=="walk") return;
  const r = scene.getBoundingClientRect();
  target = Math.max(2, Math.min(BED_X, ((e.clientX - r.left)/r.width)*100 - 4.5));
});
document.addEventListener("keydown", e=>{
  if(mode!=="walk") return;
  if(e.key==="ArrowRight"){ held=1; target=null; e.preventDefault(); }
  if(e.key==="ArrowLeft"){ held=-1; target=null; e.preventDefault(); }
});
document.addEventListener("keyup", e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft") held=0; });

function loop(t){
  const dt = last ? Math.min(.05,(t-last)/1000) : 0; last=t;
  let dir = 0;
  if(mode==="walk" || mode==="back"){
    if(held) dir = held;
    else if(target!==null){ const d=target-x; if(Math.abs(d)<.6){ x=target; target=null; } else dir=Math.sign(d); }
    x = Math.max(2, Math.min(BED_X, x + dir*SPEED*dt));
  }
  pt.style.left = x+"%";
  pt.classList.toggle("walking", dir!==0);
  if(dir<0) pt.classList.add("flip"); else if(dir>0) pt.classList.remove("flip");
  if(mode==="walk" && x>=BED_X-.1){ held=0; target=null; arrive(); }
  if(mode==="back" && target===null){ pt.classList.remove("flip"); nextPatient(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function arrive(){
  mode="talk"; hint.classList.add("hidden"); pt.classList.remove("walking");
  const p=P[idx]; say(p.name, p.say);
  const order=[0,1,2].sort(()=>Math.random()-.5);
  panel.innerHTML = `<span class="label">Co odpovíš?</span>
    <div class="opts">${order.map((k,n)=>`<button class="opt" id="o${n}" data-k="${k}"><span class="k">${"ABC"[n]}</span><span>${p.o[k].t}</span></button>`).join("")}</div>`;
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  $("o0").focus({preventScroll:true});
}

function choose(k){
  const p=P[idx], c=p.o[k];
  if(c.ok) score++;
  hud(); placePatient(c.ok?"happy":"meh"); say(p.name, c.r);
  floatText(c.ok?"+♥":"¯\\_(ツ)_/¯", c.ok?"#E2457A":"#5A716D");
  const lastOne = idx===P.length-1;
  panel.innerHTML = `<div class="react ${c.ok?'':'meh'}"><strong>${c.ok?'Odborně a s úsměvem.':'Vtipné. Ale pacient se ještě vrátí.'}</strong>${c.ok?'Pacient odchází spokojený.':'Správně by bylo: „'+p.o.find(o=>o.ok).t+'“'}</div>
    <button class="btn" id="nx">${lastOne?'Zavřít ordinaci':'Další pacient'}</button>`;
  $("nx").focus({preventScroll:true});
  $("nx").onclick = ()=>{
    if(lastOne) return finish();
    bubble.classList.add("hidden"); patientEl.classList.add("gone");
    panel.innerHTML = `<span class="label">Pacient odchází, další se ukládá na lehátko…</span>`;
    mode="back"; target=START_X;
  };
}

function nextPatient(){
  idx++; hud(); placePatient("neutral");
  requestAnimationFrame(()=>patientEl.classList.remove("gone"));
  mode="walk"; hint.classList.remove("hidden"); walkPanel();
}

function floatText(txt,color){
  const f=document.createElement("div"); f.className="float"; f.textContent=txt; f.style.color=color;
  f.style.left="64%"; f.style.top="38%"; scene.appendChild(f); setTimeout(()=>f.remove(),1500);
}

function finish(){
  mode="end";
  const ranks=[[8,"Primářka rehabilitace","Diagnostikuješ i s horečkou. Pacienti by se objednávali rok dopředu."],
    [6,"Vedoucí fyzioterapeutka","Skoro dokonalé. Ten zbytek prostě nedělal domácí cvičení."],
    [4,"Zkušená terapeutka","Solidní směna, i když napůl z postele."],
    [2,"Terapeutka na nemocenské","Mozek jede v úsporném režimu. Naprosto v pořádku."],
    [0,"Stand-up komička","Pacienti nejsou zdraví, ale nasmáli se. To se taky počítá."]];
  const r=ranks.find(x=>score>=x[0]);
  say("Ordinace", "Zavíráme! Všichni pacienti propuštěni. Teď už se léčíš jen ty.");
  panel.innerHTML = `<span class="label">Konec směny</span>
    <p class="big">${score} / ${P.length}</p>
    <strong style="font-family:var(--f-display);font-size:20px">${r[1]}</strong>
    <p class="lead" style="margin:0">${r[2]}</p>
    <div class="rx"><h3>Rp. pro terapeutku</h3>
      <ul><li>Ležet 3× denně, opakovat do vyčerpání seriálů.</li>
      <li>Horký čaj s medem dle potřeby.</li>
      <li>Žádné cvičení s pacienty, ani v duchu.</li>
      <li>Kontrola: až bude zase chuť na kafe.</li></ul></div>
    <div class="controls"><button class="btn" id="again">Nová směna</button></div>`;
  $("again").onclick = ()=>{ patientEl.classList.remove("gone"); intro(); };
}

intro();
</script>

</body>
</html>
